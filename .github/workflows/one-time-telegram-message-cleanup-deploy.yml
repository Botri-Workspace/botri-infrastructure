name: One-time Telegram message cleanup deployment

on:
  push:
    branches:
      - ops/telegram-message-cleanup-deploy-20260814

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy signal runtime and verify Telegram delivery
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          REMOTE_SCRIPT=$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          SIGNALS=/home/ubuntu/Botri-Workspace/botri-signals-bot
          sudo -u ubuntu -H git -C "$SIGNALS" fetch --prune origin
          sudo -u ubuntu -H git -C "$SIGNALS" checkout main
          sudo -u ubuntu -H git -C "$SIGNALS" reset --hard origin/main
          EXPECTED=$(sudo -u ubuntu -H git -C "$SIGNALS" rev-parse origin/main)
          sudo -u ubuntu -H bash -lc "cd '$SIGNALS' && npm install --omit=dev"
          sudo -u ubuntu -H bash -lc "cd '$SIGNALS' && pm2 startOrRestart ecosystem.config.js --update-env"
          sleep 4
          DEPLOYED=$(sudo -u ubuntu -H git -C "$SIGNALS" rev-parse HEAD)
          echo "SIGNAL_EXPECTED_COMMIT=$EXPECTED"
          echo "SIGNAL_DEPLOYED_COMMIT=$DEPLOYED"
          [ "$EXPECTED" = "$DEPLOYED" ]
          STATE=$(sudo -u ubuntu -H bash -lc 'pm2 jlist' | jq -r '.[] | select(.name == "botri-signals-bot") | [(.pm2_env.status // "unknown"), (.pid // 0 | tostring), (.pm2_env.pm_cwd // "")] | @tsv' | head -1)
          echo "SIGNAL_PM2_STATE=$STATE"
          [ "$(printf '%s' "$STATE" | cut -f1)" = online ]
          LOG=$(timeout 75s bash -c '
            while true; do
              OUT=$(sudo -u ubuntu -H bash -lc "pm2 logs botri-signals-bot --lines 250 --nostream 2>&1" || true)
              if printf "%s\n" "$OUT" | grep -Eq "Telegram candle\+signal sent .*message_id=[1-9][0-9]*"; then
                printf "%s\n" "$OUT"
                exit 0
              fi
              sleep 5
            done
          ')
          LINE=$(printf '%s\n' "$LOG" | grep -E "Telegram candle\+signal sent .*message_id=[1-9][0-9]*" | tail -1)
          echo "TELEGRAM_DELIVERY=$LINE"
          echo TELEGRAM_PRESENTATION_PROFILE=compact
          echo TELEGRAM_MESSAGE_CLEANUP_DEPLOY=PASS
          echo IQBINARY_PROCESS_INVOLVEMENT=NONE
          REMOTE_SCRIPT
          )
          SCRIPT_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)
          COMMANDS_JSON=$(python3 - "$SCRIPT_B64" <<'PY'
          import json, shlex, sys
          b64 = sys.argv[1]
          print(json.dumps({"commands": ["printf '%s' " + shlex.quote(b64) + " | base64 -d | bash"]}))
          PY
          )
          COMMAND_ID=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "one-time Telegram message presentation cleanup deployment" --parameters "$COMMANDS_JSON" --query 'Command.CommandId' --output text)
          echo "SSM_COMMAND_ID=$COMMAND_ID"
          set +e
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          WAIT_EXIT=$?
          set -e
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" | tee deployment-result.json
          STATUS=$(jq -r '.Status // "Unknown"' deployment-result.json)
          CODE=$(jq -r '.ResponseCode // -1' deployment-result.json)
          OUT=$(jq -r '.StandardOutputContent // ""' deployment-result.json)
          ERR=$(jq -r '.StandardErrorContent // ""' deployment-result.json)
          printf '%s\n' "$OUT"
          printf '%s\n' "$ERR" >&2
          if [ "$WAIT_EXIT" -ne 0 ] || [ "$STATUS" != Success ] || [ "$CODE" -ne 0 ] || ! printf '%s\n' "$OUT" | grep -q '^TELEGRAM_MESSAGE_CLEANUP_DEPLOY=PASS$'; then exit 1; fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telegram-message-cleanup-${{ github.run_id }}
          path: deployment-result.json
          if-no-files-found: warn
