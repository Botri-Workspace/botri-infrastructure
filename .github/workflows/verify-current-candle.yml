name: Telegram Current Candle E2E Verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-current-candle.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: telegram-current-candle-e2e
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify live Candle-0 from canonical runtime and send Telegram message through SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          REMOTE_SCRIPT=$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail

          APP_PATH=/home/ubuntu/Botri-Workspace/iqbinary-deriv-lab
          DB_PATH=$APP_PATH/data/candles/candles.db

          if [ ! -d "$APP_PATH/.git" ]; then
            echo "CANONICAL_RUNTIME_NOT_FOUND=$APP_PATH"
            exit 20
          fi
          if [ ! -f "$DB_PATH" ]; then
            echo "CANONICAL_CANDLE_DB_NOT_FOUND=$DB_PATH"
            exit 21
          fi

          sudo -u ubuntu -H bash -lc "cd '$APP_PATH' && node <<'NODE'
          const Database = require('better-sqlite3');
          require('dotenv').config();
          const https = require('https');

          const db = new Database('data/candles/candles.db', { readonly: true });
          const row = db.prepare(`
            SELECT symbol, granularity, open_time, open, high, low, close, updated_at
            FROM live_candles
            WHERE symbol = ? AND granularity = ?
            ORDER BY updated_at DESC
            LIMIT 1
          `).get(process.env.DERIV_SYMBOL || '1HZ100V', 60);
          db.close();

          if (!row) throw new Error('LIVE_CANDLE_0_NOT_FOUND');

          const open = Number(row.open);
          const high = Number(row.high);
          const low = Number(row.low);
          const close = Number(row.close);
          if (![open, high, low, close].every(Number.isFinite)) throw new Error('LIVE_CANDLE_OHLC_INVALID');
          if (high < Math.max(open, close)) throw new Error('LIVE_CANDLE_HIGH_INCONSISTENT');
          if (low > Math.min(open, close)) throw new Error('LIVE_CANDLE_LOW_INCONSISTENT');

          const token = process.env.SIGNAL_BOT_TOKEN;
          const chatId = process.env.SIGNAL_CHAT_ID;
          if (!token || !chatId) throw new Error('TELEGRAM_RUNTIME_CONFIG_MISSING');

          const text = [
            '🕯️ BOTRI Current Candle-0',
            '',
            `Symbol: ${row.symbol}`,
            `Timeframe: ${row.granularity}s`,
            `Open: ${open}`,
            `High: ${high}`,
            `Low: ${low}`,
            `Close: ${close}`,
            `Open Time: ${row.open_time}`,
            `Updated At: ${row.updated_at}`,
            'State: LIVE Candle-0'
          ].join('\\n');

          const payload = JSON.stringify({ chat_id: chatId, text });
          const response = await new Promise((resolve, reject) => {
            const req = https.request(`https://api.telegram.org/bot${token}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(payload) }
            }, res => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                try { resolve(JSON.parse(data)); } catch (e) { reject(e); }
              });
            });
            req.on('error', reject);
            req.write(payload);
            req.end();
          });

          if (!response || response.ok !== true || !response.result?.message_id) {
            throw new Error('TELEGRAM_SEND_NOT_CONFIRMED');
          }

          console.log('E2E_VERIFICATION=PASS');
          console.log(`SYMBOL=${row.symbol}`);
          console.log(`GRANULARITY=${row.granularity}`);
          console.log(`OPEN=${open}`);
          console.log(`HIGH=${high}`);
          console.log(`LOW=${low}`);
          console.log(`CLOSE=${close}`);
          console.log(`OPEN_TIME=${row.open_time}`);
          console.log(`UPDATED_AT=${row.updated_at}`);
          console.log(`TELEGRAM_MESSAGE_ID=${response.result.message_id}`);
          console.log('TELEGRAM_TEXT_VERIFIED=true');
          NODE"

          echo DEPLOYMENT_AND_TELEGRAM_E2E_COMPLETE
          REMOTE_SCRIPT
          )

          SCRIPT_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)
          COMMANDS_JSON=$(python3 - "$SCRIPT_B64" <<'PY'
          import json
          import shlex
          import sys
          script_b64 = sys.argv[1]
          command = "printf '%s' " + shlex.quote(script_b64) + " | base64 -d | bash -s"
          print(json.dumps({"commands": [command]}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "botri-infrastructure Telegram current candle E2E verification" \
            --parameters "$COMMANDS_JSON" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM_COMMAND_ID=$COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json | tee telegram-current-candle-e2e.json

          STATUS=$(jq -r '.Status // "Unknown"' telegram-current-candle-e2e.json)
          RESPONSE_CODE=$(jq -r '.ResponseCode // -1' telegram-current-candle-e2e.json)
          STDOUT=$(jq -r '.StandardOutputContent // ""' telegram-current-candle-e2e.json)
          STDERR=$(jq -r '.StandardErrorContent // ""' telegram-current-candle-e2e.json)

          printf '%s\n' "$STDOUT"
          printf '%s\n' "$STDERR" >&2

          if [ "$WAIT_EXIT" -ne 0 ] || [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" -ne 0 ] || ! printf '%s\n' "$STDOUT" | grep -q '^E2E_VERIFICATION=PASS$'; then
            echo "E2E verification failed: status=$STATUS response_code=$RESPONSE_CODE"
            exit 1
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telegram-current-candle-e2e-${{ github.run_id }}
          path: telegram-current-candle-e2e.json
          if-no-files-found: warn
