name: Telegram Current Candle E2E Verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-current-candle.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: telegram-current-candle-e2e
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify live Candle-0 and Telegram delivery through SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          APP_PATH=/home/ubuntu/Botri-Workspace/iqbinary-deriv-lab
          DB_PATH="$APP_PATH/data/candles/candles.db"

          JS_B64=''

          if [ ! -d "$APP_PATH" ]; then
            echo "CANONICAL_RUNTIME_NOT_FOUND=$APP_PATH"
            exit 20
          fi
          if [ ! -f "$DB_PATH" ]; then
            echo "CANONICAL_CANDLE_DB_NOT_FOUND=$DB_PATH"
            exit 21
          fi

          COMMANDS_JSON=$(python3 - "$JS_B64" "$APP_PATH" <<'PY'
          import json
          import shlex
          import sys
          script_b64, app_path = sys.argv[1:]
          command = "cd " + shlex.quote(app_path) + " && printf '%s' " + shlex.quote(script_b64) + " | base64 -d | node"
          print(json.dumps({"commands": ["sudo -u ubuntu -H bash -lc " + shlex.quote(command)]}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "botri-infrastructure Telegram current candle E2E verification" \
            --parameters "$COMMANDS_JSON" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM_COMMAND_ID=$COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json | tee telegram-current-candle-e2e.json

          STATUS=$(jq -r '.Status // "Unknown"' telegram-current-candle-e2e.json)
          RESPONSE_CODE=$(jq -r '.ResponseCode // -1' telegram-current-candle-e2e.json)
          STDOUT=$(jq -r '.StandardOutputContent // ""' telegram-current-candle-e2e.json)
          STDERR=$(jq -r '.StandardErrorContent // ""' telegram-current-candle-e2e.json)

          printf '%s\n' "$STDOUT"
          printf '%s\n' "$STDERR" >&2

          if [ "$WAIT_EXIT" -ne 0 ] || [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" -ne 0 ] || ! printf '%s\n' "$STDOUT" | grep -q '^E2E_VERIFICATION=PASS$'; then
            echo "E2E verification failed: status=$STATUS response_code=$RESPONSE_CODE"
            exit 1
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telegram-current-candle-e2e-${{ github.run_id }}
          path: telegram-current-candle-e2e.json
          if-no-files-found: warn
