name: Telegram Current Candle E2E Verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-current-candle.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: telegram-current-candle-e2e
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Diagnose runtime configuration and verify Telegram E2E through SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          REMOTE_SCRIPT=$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail

          APP_PATH=/home/ubuntu/Botri-Workspace/botri-signals-bot

          if [ ! -d "$APP_PATH/.git" ]; then
            echo "REPOSITORY_NOT_FOUND=$APP_PATH"
            exit 20
          fi

          sudo -u ubuntu -H git config --global --add safe.directory "$APP_PATH"
          sudo -u ubuntu -H git -C "$APP_PATH" fetch --prune origin
          EXPECTED_COMMIT=$(sudo -u ubuntu -H git -C "$APP_PATH" rev-parse "origin/main^{commit}")
          sudo -u ubuntu -H git -C "$APP_PATH" checkout main
          sudo -u ubuntu -H git -C "$APP_PATH" reset --hard "origin/main"
          DEPLOYED_COMMIT=$(sudo -u ubuntu -H git -C "$APP_PATH" rev-parse HEAD)

          echo "EXPECTED_COMMIT=$EXPECTED_COMMIT"
          echo "DEPLOYED_COMMIT=$DEPLOYED_COMMIT"
          if [ "$DEPLOYED_COMMIT" != "$EXPECTED_COMMIT" ]; then exit 24; fi
          echo DEPLOYMENT_COMMIT_VERIFIED

          echo "APP_FILES:"
          sudo -u ubuntu -H bash -lc "cd '$APP_PATH' && find . -maxdepth 2 -type f -not -path './.git/*' -printf '%p\n' | sort"

          echo "ENV_FILE_PRESENCE:"
          for file in "$APP_PATH/.env" "$APP_PATH/.env.production" "$APP_PATH/.env.local"; do
            if [ -f "$file" ]; then echo "PRESENT=$file"; else echo "ABSENT=$file"; fi
          done

          echo "ECOSYSTEM_CANDIDATES:"
          find /home/ubuntu/Botri-Workspace -maxdepth 4 -type f \( -name 'ecosystem*.js' -o -name 'ecosystem*.cjs' -o -name 'ecosystem*.json' \) -print 2>/dev/null | sort || true

          echo "PM2_RUNTIME_METADATA:"
          sudo -u ubuntu -H bash -lc 'pm2 jlist' | jq -r '
            .[]
            | select(.name | ascii_downcase | gsub("[^a-z0-9]"; "") == "botrisignalbot")
            | {
                name,
                pm_cwd: .pm2_env.pm_cwd,
                pm_exec_path: .pm2_env.pm_exec_path,
                status: .pm2_env.status,
                pid: .pid
              }
          '

          PM2_PID=$(sudo -u ubuntu -H bash -lc 'pm2 jlist' | jq -r '
            .[]
            | select(.name | ascii_downcase | gsub("[^a-z0-9]"; "") == "botrisignalbot")
            | .pid
          ' | head -1)

          if [ -z "$PM2_PID" ] || [ "$PM2_PID" = "null" ] || [ "$PM2_PID" = "0" ]; then
            echo PM2_PID_UNAVAILABLE
            exit 26
          fi

          echo "PM2_PROCESS_ENV_KEYS:"
          sudo tr '\0' '\n' < "/proc/$PM2_PID/environ" \
            | cut -d= -f1 \
            | grep -E '^(DERIV_SYMBOL|SIGNAL_TIMEFRAME|MARKET_DATA_BASE_URL|MARKET_DATA_TIMEOUT_MS|TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID|TELEGRAM_TIMEOUT_MS)$' \
            | sort \
            | sed 's/$/=PRESENT/' || true

          echo "PM2_LOG_TAIL:"
          sudo -u ubuntu -H bash -lc 'pm2 logs Botri-Signal-Bot --lines 30 --nostream' || true

          echo "DIRECT_CONFIG_CHECK:"
          sudo -u ubuntu -H bash -lc "cd '$APP_PATH' && node -e 'const {loadConfig}=require(\"./src/config\"); console.log(loadConfig())'"

          echo "E2E_VERIFICATION_START"
          sudo -u ubuntu -H bash -lc "cd '$APP_PATH' && node scripts/verify-current-candle.js"
          echo DEPLOYMENT_AND_TELEGRAM_E2E_COMPLETE
          REMOTE_SCRIPT
          )

          SCRIPT_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)
          COMMANDS_JSON=$(python3 - "$SCRIPT_B64" <<'PY'
          import json
          import shlex
          import sys
          script_b64 = sys.argv[1]
          command = "printf '%s' " + shlex.quote(script_b64) + " | base64 -d | bash -s"
          print(json.dumps({"commands": [command]}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "botri-infrastructure Telegram current candle E2E verification" \
            --parameters "$COMMANDS_JSON" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM_COMMAND_ID=$COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json | tee telegram-current-candle-e2e.json

          STATUS=$(jq -r '.Status // "Unknown"' telegram-current-candle-e2e.json)
          RESPONSE_CODE=$(jq -r '.ResponseCode // -1' telegram-current-candle-e2e.json)
          STDOUT=$(jq -r '.StandardOutputContent // ""' telegram-current-candle-e2e.json)
          STDERR=$(jq -r '.StandardErrorContent // ""' telegram-current-candle-e2e.json)

          printf '%s\n' "$STDOUT"
          printf '%s\n' "$STDERR" >&2

          if [ "$WAIT_EXIT" -ne 0 ] || [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" -ne 0 ] || ! printf '%s\n' "$STDOUT" | grep -q '^E2E_VERIFICATION=PASS$'; then
            echo "E2E verification failed: status=$STATUS response_code=$RESPONSE_CODE"
            exit 1
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telegram-current-candle-e2e-${{ github.run_id }}
          path: telegram-current-candle-e2e.json
          if-no-files-found: warn
