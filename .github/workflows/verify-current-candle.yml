name: Telegram Current Candle E2E Verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-current-candle.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: telegram-current-candle-e2e
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy latest signal bot and verify Telegram E2E through SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          REMOTE_SCRIPT=$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail

          APP_PATH=/home/ubuntu/Botri-Workspace/botri-signals-bot
          TARGET_REF=main
          EXPECTED_REPOSITORY=botri-signals-bot

          if [ ! -d "$APP_PATH/.git" ]; then
            echo "REPOSITORY_NOT_FOUND=$APP_PATH"
            exit 20
          fi

          sudo -u ubuntu -H git config --global --add safe.directory "$APP_PATH"
          sudo -u ubuntu -H git -C "$APP_PATH" remote get-url origin
          GIT_TERMINAL_PROMPT=0 sudo -u ubuntu -H git -C "$APP_PATH" fetch --prune origin

          EXPECTED_COMMIT=$(sudo -u ubuntu -H git -C "$APP_PATH" rev-parse "origin/$TARGET_REF^{commit}")
          sudo -u ubuntu -H git -C "$APP_PATH" checkout "$TARGET_REF"
          sudo -u ubuntu -H git -C "$APP_PATH" reset --hard "origin/$TARGET_REF"
          DEPLOYED_COMMIT=$(sudo -u ubuntu -H git -C "$APP_PATH" rev-parse HEAD)

          echo "EXPECTED_COMMIT=$EXPECTED_COMMIT"
          echo "DEPLOYED_COMMIT=$DEPLOYED_COMMIT"

          if [ "$DEPLOYED_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "DEPLOYMENT_COMMIT_MISMATCH"
            exit 24
          fi

          echo DEPLOYMENT_COMMIT_VERIFIED

          PM2_APP=$(sudo -u ubuntu -H bash -lc 'pm2 jlist' | jq -r '
            .[]
            | select(.name | ascii_downcase | gsub("[^a-z0-9]"; "") == "botrisignalbot")
            | .name
          ' | head -1)

          if [ -z "$PM2_APP" ]; then
            echo PM2_APP_NOT_FOUND
            sudo -u ubuntu -H bash -lc 'pm2 status'
            exit 22
          fi

          echo "PM2_APP=$PM2_APP"
          sudo -u ubuntu -H bash -lc "pm2 restart $(printf '%q' "$PM2_APP")"
          sleep 3

          PM2_STATE=$(sudo -u ubuntu -H bash -lc 'pm2 jlist' | jq -r --arg app "$PM2_APP" '
            .[]
            | select(.name == $app)
            | [(.pm2_env.status // "unknown"), (.pid // 0 | tostring)]
            | @tsv
          ' | head -1)

          PM2_STATUS=$(printf '%s' "$PM2_STATE" | cut -f1)
          PM2_PID=$(printf '%s' "$PM2_STATE" | cut -f2)
          echo "PM2_STATUS=$PM2_STATUS"
          echo "PM2_PID=$PM2_PID"

          if [ "$PM2_STATUS" != "online" ] || ! printf '%s' "$PM2_PID" | grep -Eq '^[1-9][0-9]*$'; then
            echo PM2_RUNTIME_NOT_HEALTHY
            sudo -u ubuntu -H bash -lc 'pm2 status'
            exit 27
          fi

          echo PM2_RUNTIME_VERIFIED

          sudo -u ubuntu -H bash -lc "cd '$APP_PATH' && node scripts/verify-current-candle.js"

          echo DEPLOYMENT_AND_TELEGRAM_E2E_COMPLETE
          REMOTE_SCRIPT
          )

          SCRIPT_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)
          COMMANDS_JSON=$(python3 - "$SCRIPT_B64" <<'PY'
          import json
          import shlex
          import sys
          script_b64 = sys.argv[1]
          command = "printf '%s' " + shlex.quote(script_b64) + " | base64 -d | bash -s"
          print(json.dumps({"commands": [command]}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "botri-infrastructure Telegram current candle E2E verification" \
            --parameters "$COMMANDS_JSON" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM_COMMAND_ID=$COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json | tee telegram-current-candle-e2e.json

          STATUS=$(jq -r '.Status // "Unknown"' telegram-current-candle-e2e.json)
          RESPONSE_CODE=$(jq -r '.ResponseCode // -1' telegram-current-candle-e2e.json)
          STDOUT=$(jq -r '.StandardOutputContent // ""' telegram-current-candle-e2e.json)
          STDERR=$(jq -r '.StandardErrorContent // ""' telegram-current-candle-e2e.json)

          printf '%s\n' "$STDOUT"
          printf '%s\n' "$STDERR" >&2

          if [ "$WAIT_EXIT" -ne 0 ] || [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" -ne 0 ] || ! printf '%s\n' "$STDOUT" | grep -q '^E2E_VERIFICATION=PASS$'; then
            echo "E2E verification failed: status=$STATUS response_code=$RESPONSE_CODE"
            exit 1
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telegram-current-candle-e2e-${{ github.run_id }}
          path: telegram-current-candle-e2e.json
          if-no-files-found: warn
