name: Telegram Current Candle E2E Verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-current-candle.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: telegram-current-candle-e2e
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify live Candle-0 and Telegram delivery through SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          JS_B64=''

          REMOTE_SCRIPT=$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          JS_B64="$1"

          PM2_CWD=$(sudo -u ubuntu -H bash -lc 'pm2 jlist' | jq -r '
            .[]
            | select(.name | ascii_downcase | gsub("[^a-z0-9]"; "") == "botrisignalbot")
            | .pm2_env.pm_cwd
          ' | head -1)

          if [ -z "$PM2_CWD" ] || [ "$PM2_CWD" = "null" ]; then
            echo PM2_CWD_NOT_FOUND
            exit 30
          fi
          echo "PM2_CWD=$PM2_CWD"

          DB_PATH="$PM2_CWD/data/candles/candles.db"
          if [ ! -f "$DB_PATH" ]; then
            echo "CANDLE_DB_NOT_FOUND=$DB_PATH"
            find "$PM2_CWD" -maxdepth 4 -type f -name 'candles.db' -print 2>/dev/null || true
            exit 32
          fi

          if [ -f "$PM2_CWD/.env" ]; then
            set -a
            . "$PM2_CWD/.env"
            set +a
          fi

          ROW_JSON=$(sudo -u ubuntu -H bash -lc "cd '$PM2_CWD' && printf '%s' '$JS_B64' | base64 -d | node")
          echo "CANDLE_JSON=$ROW_JSON"

          SYMBOL=$(printf '%s' "$ROW_JSON" | jq -r '.symbol')
          GRANULARITY=$(printf '%s' "$ROW_JSON" | jq -r '.granularity')
          OPEN=$(printf '%s' "$ROW_JSON" | jq -r '.open')
          HIGH=$(printf '%s' "$ROW_JSON" | jq -r '.high')
          LOW=$(printf '%s' "$ROW_JSON" | jq -r '.low')
          CLOSE=$(printf '%s' "$ROW_JSON" | jq -r '.close')
          OPEN_TIME=$(printf '%s' "$ROW_JSON" | jq -r '.open_time')
          UPDATED_AT=$(printf '%s' "$ROW_JSON" | jq -r '.updated_at')

          if [ -z "${SIGNAL_BOT_TOKEN:-}" ] || [ -z "${SIGNAL_CHAT_ID:-}" ]; then
            echo TELEGRAM_RUNTIME_CONFIG_MISSING
            exit 33
          fi

          MESSAGE="🕯️ BOTRI Current Candle-0

Symbol: $SYMBOL
Timeframe: ${GRANULARITY}s
Open: $OPEN
High: $HIGH
Low: $LOW
Close: $CLOSE
Open Time: $OPEN_TIME
Updated At: $UPDATED_AT
State: LIVE Candle-0"

          RESPONSE=$(curl --connect-timeout 5 --max-time 15 -fsS -X POST \
            "https://api.telegram.org/bot${SIGNAL_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${SIGNAL_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}")

          TELEGRAM_OK=$(printf '%s' "$RESPONSE" | jq -r '.ok // false')
          MESSAGE_ID=$(printf '%s' "$RESPONSE" | jq -r '.result.message_id // empty')
          echo "TELEGRAM_OK=$TELEGRAM_OK"
          echo "TELEGRAM_MESSAGE_ID=$MESSAGE_ID"

          if [ "$TELEGRAM_OK" != "true" ] || [ -z "$MESSAGE_ID" ]; then
            echo TELEGRAM_SEND_NOT_CONFIRMED
            exit 34
          fi

          echo E2E_VERIFICATION=PASS
          echo "SYMBOL=$SYMBOL"
          echo "GRANULARITY=$GRANULARITY"
          echo "OPEN=$OPEN"
          echo "HIGH=$HIGH"
          echo "LOW=$LOW"
          echo "CLOSE=$CLOSE"
          echo "OPEN_TIME=$OPEN_TIME"
          echo "UPDATED_AT=$UPDATED_AT"
          echo TELEGRAM_TEXT_VERIFIED=true
          REMOTE_SCRIPT
          )

          SCRIPT_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)
          COMMANDS_JSON=$(python3 - "$SCRIPT_B64" "$JS_B64" <<'PY'
          import json
          import shlex
          import sys
          script_b64, js_b64 = sys.argv[1:]
          command = "printf '%s' " + shlex.quote(script_b64) + " | base64 -d | bash -s -- " + shlex.quote(js_b64)
          print(json.dumps({"commands": [command]}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "botri-infrastructure Telegram current candle E2E verification" \
            --parameters "$COMMANDS_JSON" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM_COMMAND_ID=$COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json | tee telegram-current-candle-e2e.json

          STATUS=$(jq -r '.Status // "Unknown"' telegram-current-candle-e2e.json)
          RESPONSE_CODE=$(jq -r '.ResponseCode // -1' telegram-current-candle-e2e.json)
          STDOUT=$(jq -r '.StandardOutputContent // ""' telegram-current-candle-e2e.json)
          STDERR=$(jq -r '.StandardErrorContent // ""' telegram-current-candle-e2e.json)

          printf '%s\n' "$STDOUT"
          printf '%s\n' "$STDERR" >&2

          if [ "$WAIT_EXIT" -ne 0 ] || [ "$STATUS" != "Success" ] || [ "$RESPONSE_CODE" -ne 0 ] || ! printf '%s\n' "$STDOUT" | grep -q '^E2E_VERIFICATION=PASS$'; then
            echo "E2E verification failed: status=$STATUS response_code=$RESPONSE_CODE"
            exit 1
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: telegram-current-candle-e2e-${{ github.run_id }}
          path: telegram-current-candle-e2e.json
          if-no-files-found: warn
