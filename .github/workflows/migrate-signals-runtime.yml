name: Migrate Signal Runtime Ownership

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Migrate PM2 runtime from iqbinary to botri-signals-bot
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          REMOTE_SCRIPT=$(cat <<'REMOTE_SCRIPT'
          set -euo pipefail

          TARGET=/home/ubuntu/Botri-Workspace/botri-signals-bot
          REPO_SSH='git@github.com:Botri-Workspace/botri-signals-bot.git'
          REPO_HTTPS='https://github.com/Botri-Workspace/botri-signals-bot.git'

          echo MIGRATION_BEGIN
          echo "TARGET=$TARGET"

          PM2_JSON=$(sudo -u ubuntu -H bash -lc 'pm2 jlist')
          LEGACY_APP=$(printf '%s' "$PM2_JSON" | jq -r --arg target "$TARGET" '
            .[]
            | . as $app
            | ($app.name | ascii_downcase | gsub("[^a-z0-9]"; "")) as $normalized
            | select($normalized == "botrisignalbot")
            | select(($app.pm2_env.pm_cwd // "") != $target)
            | $app.name
          ' | head -1)
          LEGACY_CWD=''
          if [ -n "$LEGACY_APP" ]; then
            LEGACY_CWD=$(printf '%s' "$PM2_JSON" | jq -r --arg app "$LEGACY_APP" '.[] | select(.name == $app) | .pm2_env.pm_cwd' | head -1)
          fi
          echo "LEGACY_APP=${LEGACY_APP:-NONE}"
          echo "LEGACY_CWD=${LEGACY_CWD:-NONE}"

          if [ ! -d "$TARGET/.git" ]; then
            mkdir -p "$(dirname "$TARGET")"
            if GIT_TERMINAL_PROMPT=0 GIT_SSH_COMMAND='ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new' sudo -u ubuntu -H git ls-remote "$REPO_SSH" HEAD >/dev/null 2>&1; then
              sudo -u ubuntu -H git clone --branch main --single-branch "$REPO_SSH" "$TARGET"
              echo BOOTSTRAP_AUTH=ssh
            elif GIT_TERMINAL_PROMPT=0 sudo -u ubuntu -H git ls-remote "$REPO_HTTPS" HEAD >/dev/null 2>&1; then
              sudo -u ubuntu -H git clone --branch main --single-branch "$REPO_HTTPS" "$TARGET"
              echo BOOTSTRAP_AUTH=https-credential-helper
            elif command -v gh >/dev/null 2>&1 && sudo -u ubuntu -H gh auth status >/dev/null 2>&1; then
              sudo -u ubuntu -H gh repo clone Botri-Workspace/botri-signals-bot "$TARGET" -- --branch main --single-branch
              echo BOOTSTRAP_AUTH=gh
            else
              echo GITHUB_AUTH_UNAVAILABLE
              exit 20
            fi
          fi

          sudo -u ubuntu -H git config --global --add safe.directory "$TARGET"
          GIT_TERMINAL_PROMPT=0 sudo -u ubuntu -H git -C "$TARGET" fetch --prune origin
          sudo -u ubuntu -H git -C "$TARGET" checkout main
          sudo -u ubuntu -H git -C "$TARGET" reset --hard origin/main

          NODE_VERSION=$(node --version)
          echo "NODE_VERSION=$NODE_VERSION"
          NODE_MAJOR=$(node -p 'process.versions.node.split(".")[0]')
          NODE_MINOR=$(node -p 'process.versions.node.split(".")[1]')
          if [ "$NODE_MAJOR" -lt 20 ] || { [ "$NODE_MAJOR" -eq 20 ] && [ "$NODE_MINOR" -lt 10 ]; }; then
            echo NODE_VERSION_TOO_OLD
            exit 21
          fi

          sudo -u ubuntu -H bash -lc "cd '$TARGET' && npm ci"

          if [ -n "$LEGACY_CWD" ] && [ -f "$LEGACY_CWD/.env" ]; then
            sudo -u ubuntu -H bash -lc "grep -E '^(TELEGRAM_BOT_TOKEN|TELEGRAM_CHAT_ID|DERIV_SYMBOL|SIGNAL_TIMEFRAME|SIGNAL_POLL_MS|DERIV_WS_URL|DERIV_APP_ID|MARKET_DATA_TIMEOUT_MS|TELEGRAM_TIMEOUT_MS)=' '$LEGACY_CWD/.env' > '$TARGET/.env' || true"
            chmod 600 "$TARGET/.env"
            chown ubuntu:ubuntu "$TARGET/.env"
          fi

          if [ ! -f "$TARGET/.env" ]; then
            echo NEW_RUNTIME_ENV_MISSING
            exit 22
          fi
          sudo -u ubuntu -H bash -lc "cd '$TARGET' && grep -q '^TELEGRAM_BOT_TOKEN=' .env && grep -q '^TELEGRAM_CHAT_ID=' .env"

          sudo -u ubuntu -H bash -lc "cd '$TARGET' && pm2 startOrRestart ecosystem.config.js --update-env"
          sleep 5

          PM2_STATE=$(sudo -u ubuntu -H bash -lc 'pm2 jlist' | jq -r '
            .[]
            | select(.name == "botri-signals-bot")
            | [(.pm2_env.status // "unknown"), (.pid // 0 | tostring), (.pm2_env.pm_cwd // "")]
            | @tsv
          ' | head -1)

          if [ -z "$PM2_STATE" ]; then
            echo CANONICAL_PM2_ENTRY_MISSING
            sudo -u ubuntu -H bash -lc 'pm2 status'
            exit 23
          fi

          PM2_STATUS=$(printf '%s' "$PM2_STATE" | cut -f1)
          PM2_PID=$(printf '%s' "$PM2_STATE" | cut -f2)
          PM2_CWD=$(printf '%s' "$PM2_STATE" | cut -f3)
          echo "PM2_STATUS=$PM2_STATUS"
          echo "PM2_PID=$PM2_PID"
          echo "PM2_CWD=$PM2_CWD"

          if [ "$PM2_STATUS" != online ] || ! printf '%s' "$PM2_PID" | grep -Eq '^[1-9][0-9]*$' || [ "$PM2_CWD" != "$TARGET" ]; then
            echo CANONICAL_PM2_RUNTIME_NOT_HEALTHY
            sudo -u ubuntu -H bash -lc 'pm2 status'
            exit 24
          fi

          if [ -n "$LEGACY_APP" ]; then
            sudo -u ubuntu -H bash -lc "pm2 delete $(printf '%q' "$LEGACY_APP")"
            echo LEGACY_PM2_RUNTIME_REMOVED=true
          fi

          sudo -u ubuntu -H bash -lc 'pm2 save'
          echo CANONICAL_PM2_RUNTIME=botri-signals-bot
          echo CANONICAL_RUNTIME_CWD=$TARGET
          echo IQBINARY_PROCESS_INVOLVEMENT=NONE
          echo MIGRATION_COMPLETE
          sudo -u ubuntu -H bash -lc 'pm2 status'
          REMOTE_SCRIPT
          )

          SCRIPT_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)
          COMMANDS_JSON=$(python3 - "$SCRIPT_B64" <<'PY'
          import json
          import shlex
          import sys
          script_b64 = sys.argv[1]
          command = "printf '%s' " + shlex.quote(script_b64) + " | base64 -d | bash -s"
          print(json.dumps({"commands": [command]}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "botri-infrastructure canonical signals runtime migration" \
            --parameters "$COMMANDS_JSON" \
            --query 'Command.CommandId' --output text)
          echo "SSM_COMMAND_ID=$COMMAND_ID"

          set +e
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" | tee migration-result.json

          STATUS=$(jq -r '.Status // "Unknown"' migration-result.json)
          RESPONSE_CODE=$(jq -r '.ResponseCode // -1' migration-result.json)
          STDOUT=$(jq -r '.StandardOutputContent // ""' migration-result.json)
          STDERR=$(jq -r '.StandardErrorContent // ""' migration-result.json)
          printf '%s\n' "$STDOUT"
          printf '%s\n' "$STDERR" >&2

          if [ "$WAIT_EXIT" -ne 0 ] || [ "$STATUS" != Success ] || [ "$RESPONSE_CODE" -ne 0 ] || ! printf '%s\n' "$STDOUT" | grep -q '^MIGRATION_COMPLETE$'; then
            echo "Migration failed: status=$STATUS response_code=$RESPONSE_CODE"
            exit 1
          fi

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: signals-runtime-migration-${{ github.run_id }}
          path: migration-result.json
          if-no-files-found: warn
