name: EC2 Repository Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing AWS configuration
        required: true
        default: production
        type: string
      target_repository:
        description: Repository directory name already checked out on EC2
        required: true
        type: string
      target_ref:
        description: Git ref to deploy
        required: true
        default: main
        type: string
      application_path:
        description: Preferred application path on EC2; existing repo path is auto-discovered if absent
        required: true
        type: string
      runtime_action:
        description: Runtime action after synchronization
        required: true
        default: none
        type: choice
        options:
          - none
          - restart
          - reload

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_REF: ${{ inputs.target_ref }}
          APPLICATION_PATH: ${{ inputs.application_path }}
          RUNTIME_ACTION: ${{ inputs.runtime_action }}
        run: |
          set -euo pipefail

          case "$TARGET_REPOSITORY" in
            ''|*[!A-Za-z0-9._-]*) echo 'Rejected: invalid target_repository'; exit 2 ;;
          esac
          case "$TARGET_REF" in
            ''|*[!A-Za-z0-9._/-]*|*..*|/*) echo 'Rejected: invalid target_ref'; exit 2 ;;
          esac
          case "$RUNTIME_ACTION" in
            none|restart|reload) ;;
            *) echo 'Rejected: invalid runtime_action'; exit 2 ;;
          esac

          COMMANDS_JSON=$(jq -n \
            --arg preferred "$APPLICATION_PATH" \
            --arg ref "$TARGET_REF" \
            --arg action "$RUNTIME_ACTION" \
            --arg repo "$TARGET_REPOSITORY" \
            '{commands: [
              "set -u",
              "echo DEPLOY_BEGIN",
              ("PREFERRED_PATH=" + ($preferred|@sh)),
              ("TARGET_REF=" + ($ref|@sh)),
              ("RUNTIME_ACTION=" + ($action|@sh)),
              ("TARGET_REPOSITORY=" + ($repo|@sh)),
              "DEPLOY_PATH=",
              "if [ -d \"$PREFERRED_PATH/.git\" ]; then DEPLOY_PATH=\"$PREFERRED_PATH\"; fi",
              "if [ -z \"$DEPLOY_PATH\" ]; then while IFS= read -r gitdir; do candidate=${gitdir%/.git}; if git -C \"$candidate\" remote get-url origin 2>/dev/null | grep -qiE \"(^|[/:])${TARGET_REPOSITORY}([.]git)?$\"; then DEPLOY_PATH=\"$candidate\"; break; fi; done < <(find /home/ubuntu -type d -name .git -prune -print 2>/dev/null); fi",
              "if [ -z \"$DEPLOY_PATH\" ]; then echo REPOSITORY_NOT_FOUND; echo DISCOVERY_CANDIDATES; find /home/ubuntu -maxdepth 5 -type d -name .git -prune -print 2>/dev/null | sed 's#/.git$##'; exit 20; fi",
              "echo DEPLOY_PATH=$DEPLOY_PATH",
              "git -C \"$DEPLOY_PATH\" rev-parse --show-toplevel",
              "git -C \"$DEPLOY_PATH\" remote -v",
              "GIT_TERMINAL_PROMPT=0 git -C \"$DEPLOY_PATH\" fetch --prune origin",
              "git -C \"$DEPLOY_PATH\" checkout \"$TARGET_REF\"",
              "git -C \"$DEPLOY_PATH\" reset --ff-only \"origin/$TARGET_REF\"",
              "echo DEPLOYED_COMMIT=$(git -C \"$DEPLOY_PATH\" rev-parse HEAD)",
              "if [ \"$RUNTIME_ACTION\" = restart ] || [ \"$RUNTIME_ACTION\" = reload ]; then PM2_APP=$(pm2 jlist 2>/dev/null | jq -r --arg n \"$TARGET_REPOSITORY\" '.[] | select((.name|ascii_downcase) == ($n|ascii_downcase)) | .name' | head -1); if [ -z \"$PM2_APP\" ]; then echo PM2_APP_NOT_FOUND; pm2 status; exit 21; fi; echo PM2_APP=$PM2_APP; if [ \"$RUNTIME_ACTION\" = restart ]; then pm2 restart \"$PM2_APP\"; else pm2 reload \"$PM2_APP\"; fi; fi",
              "pm2 status",
              "echo DEPLOYMENT_COMPLETE"
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "botri-infrastructure deployment ${TARGET_REPOSITORY}@${TARGET_REF}" \
            --parameters "$COMMANDS_JSON" \
            --query 'Command.CommandId' --output text)

          echo "SSM_COMMAND_ID=$COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" | tee deployment-result.json

          COMMAND_STATUS=$(jq -r '.Status // "Unknown"' deployment-result.json)
          COMMAND_STATUS_DETAILS=$(jq -r '.StatusDetails // "Unknown"' deployment-result.json)
          COMMAND_STDOUT=$(jq -r '.StandardOutputContent // ""' deployment-result.json)
          COMMAND_STDERR=$(jq -r '.StandardErrorContent // ""' deployment-result.json)

          printf '%s\n' "$COMMAND_STDOUT"
          printf '%s\n' "$COMMAND_STDERR" >&2
          echo "SSM_STATUS=$COMMAND_STATUS"
          echo "SSM_STATUS_DETAILS=$COMMAND_STATUS_DETAILS"

          if [ "$WAIT_EXIT" -ne 0 ] || [ "$COMMAND_STATUS" != "Success" ]; then
            echo "SSM deployment failed: status=$COMMAND_STATUS status_details=$COMMAND_STATUS_DETAILS"
            exit 1
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec2-deployment-${{ github.run_id }}
          path: deployment-result.json
          if-no-files-found: warn
