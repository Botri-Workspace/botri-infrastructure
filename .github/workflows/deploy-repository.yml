name: EC2 Repository Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing AWS configuration
        required: true
        default: production
        type: string
      target_repository:
        description: Repository directory name already checked out on EC2
        required: true
        type: string
      target_ref:
        description: Git ref to deploy
        required: true
        default: main
        type: string
      application_path:
        description: Absolute application path on EC2
        required: true
        type: string
      runtime_action:
        description: Runtime action after synchronization
        required: true
        default: none
        type: choice
        options:
          - none
          - restart
          - reload

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_REF: ${{ inputs.target_ref }}
          APPLICATION_PATH: ${{ inputs.application_path }}
          RUNTIME_ACTION: ${{ inputs.runtime_action }}
        run: |
          set -euo pipefail
          case "$APPLICATION_PATH" in
            /home/ubuntu/Botri-Workspace/*[!A-Za-z0-9._/-]*) echo 'Rejected: invalid application_path'; exit 2 ;;
            /home/ubuntu/Botri-Workspace/*) ;;
            *) echo 'Rejected: application_path must be under /home/ubuntu/Botri-Workspace'; exit 2 ;;
          esac
          case "$TARGET_REPOSITORY" in
            ''|*[!A-Za-z0-9._-]*) echo 'Rejected: invalid target_repository'; exit 2 ;;
          esac
          case "$TARGET_REF" in
            ''|*[!A-Za-z0-9._/-]*|*..*|/*) echo 'Rejected: invalid target_ref'; exit 2 ;;
          esac
          case "$RUNTIME_ACTION" in
            none|restart|reload) ;;
            *) echo 'Rejected: invalid runtime_action'; exit 2 ;;
          esac

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "botri-infrastructure deployment ${TARGET_REPOSITORY}@${TARGET_REF}" \
            --parameters commands="set -euo pipefail; test -d '$APPLICATION_PATH/.git'; git -C '$APPLICATION_PATH' fetch --prune origin; git -C '$APPLICATION_PATH' checkout '$TARGET_REF'; git -C '$APPLICATION_PATH' reset --ff-only 'origin/$TARGET_REF'; if [ '$RUNTIME_ACTION' = restart ]; then pm2 restart '$TARGET_REPOSITORY'; elif [ '$RUNTIME_ACTION' = reload ]; then pm2 reload '$TARGET_REPOSITORY'; fi; echo DEPLOYMENT_COMPLETE; git -C '$APPLICATION_PATH' rev-parse HEAD; pm2 status" \
            --query 'Command.CommandId' --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" | tee deployment-result.json

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: ec2-deployment-${{ github.run_id }}
          path: deployment-result.json
