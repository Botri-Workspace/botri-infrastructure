name: EC2 Repository Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing AWS configuration
        required: true
        default: production
        type: string
      target_repository:
        description: Repository directory name to deploy on EC2
        required: true
        default: botri-market-data
        type: string
      target_ref:
        description: Git ref to deploy
        required: true
        default: main
        type: string
      application_path:
        description: Preferred application path on EC2
        required: true
        default: /home/ubuntu/Botri-Workspace/botri-market-data
        type: string
      runtime_action:
        description: Runtime action after synchronization
        required: true
        default: restart
        type: choice
        options:
          - none
          - restart
          - reload
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        default: production
      target_repository:
        required: true
        type: string
      target_ref:
        required: false
        type: string
        default: main
      application_path:
        required: true
        type: string
      runtime_action:
        required: false
        type: string
        default: restart
    secrets: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through existing EC2 SSM path
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_REF: ${{ inputs.target_ref }}
          APPLICATION_PATH: ${{ inputs.application_path }}
          RUNTIME_ACTION: ${{ inputs.runtime_action }}
        run: |
          set -euo pipefail
          case "$TARGET_REPOSITORY" in
            ''|*[!A-Za-z0-9._-]*) echo 'Rejected: invalid target_repository'; exit 2 ;;
          esac
          case "$TARGET_REF" in
            ''|*[!A-Za-z0-9._/-]*|*..*|/*) echo 'Rejected: invalid target_ref'; exit 2 ;;
          esac
          case "$RUNTIME_ACTION" in
            none|restart|reload) ;;
            *) echo 'Rejected: invalid runtime_action'; exit 2 ;;
          esac
          case "$APPLICATION_PATH" in
            /home/ubuntu/Botri-Workspace/*) ;;
            *) echo 'Rejected: application_path must be under /home/ubuntu/Botri-Workspace'; exit 2 ;;
          esac

          REMOTE_SCRIPT='set -euo pipefail
          PREFERRED_PATH="$1"
          TARGET_REF="$2"
          RUNTIME_ACTION="$3"
          TARGET_REPOSITORY="$4"
          DEPLOY_PATH="$PREFERRED_PATH"
          REPO_SSH="git@github.com:Botri-Workspace/${TARGET_REPOSITORY}.git"
          REPO_HTTPS="https://github.com/Botri-Workspace/${TARGET_REPOSITORY}.git"
          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            mkdir -p "$(dirname "$DEPLOY_PATH")"
            if sudo -u ubuntu -H git ls-remote "$REPO_SSH" HEAD >/dev/null 2>&1; then
              sudo -u ubuntu -H git clone --branch "$TARGET_REF" --single-branch "$REPO_SSH" "$DEPLOY_PATH"
            elif sudo -u ubuntu -H git ls-remote "$REPO_HTTPS" HEAD >/dev/null 2>&1; then
              sudo -u ubuntu -H git clone --branch "$TARGET_REF" --single-branch "$REPO_HTTPS" "$DEPLOY_PATH"
            elif command -v gh >/dev/null 2>&1 && sudo -u ubuntu -H gh auth status >/dev/null 2>&1; then
              sudo -u ubuntu -H gh repo clone "Botri-Workspace/${TARGET_REPOSITORY}" "$DEPLOY_PATH" -- --branch "$TARGET_REF" --single-branch
            else
              echo GITHUB_AUTH_UNAVAILABLE
              exit 20
            fi
          fi
          sudo -u ubuntu -H git -C "$DEPLOY_PATH" fetch --prune origin
          sudo -u ubuntu -H git -C "$DEPLOY_PATH" checkout "$TARGET_REF"
          sudo -u ubuntu -H git -C "$DEPLOY_PATH" reset --hard "origin/$TARGET_REF"
          EXPECTED_COMMIT=$(sudo -u ubuntu -H git -C "$DEPLOY_PATH" rev-parse "origin/$TARGET_REF^{commit}")
          DEPLOYED_COMMIT=$(sudo -u ubuntu -H git -C "$DEPLOY_PATH" rev-parse HEAD)
          test "$DEPLOYED_COMMIT" = "$EXPECTED_COMMIT"
          echo "DEPLOYED_COMMIT=$DEPLOYED_COMMIT"
          if [ "$RUNTIME_ACTION" = restart ] || [ "$RUNTIME_ACTION" = reload ]; then
            if ! sudo -u ubuntu -H bash -lc "command -v pm2 >/dev/null 2>&1"; then
              echo PM2_NOT_AVAILABLE
              exit 21
            fi
            case "$TARGET_REPOSITORY" in
              botri-signals-bot)
                sudo -u ubuntu -H bash -lc "pm2 restart botri-signals-bot"
                ;;
              botri-market-data)
                sudo -u ubuntu -H bash -lc "pm2 restart botri-market-data || pm2 restart botri-market-data-storage"
                ;;
              *)
                if sudo -u ubuntu -H bash -lc "pm2 describe '$TARGET_REPOSITORY' >/dev/null 2>&1"; then
                  sudo -u ubuntu -H bash -lc "pm2 restart '$TARGET_REPOSITORY'"
                else
                  echo "PM2_PROCESS_NOT_FOUND=$TARGET_REPOSITORY"
                  exit 22
                fi
                ;;
            esac
            sleep 2
            sudo -u ubuntu -H bash -lc "pm2 status"
          fi
          if [ "$TARGET_REPOSITORY" = botri-signals-bot ]; then
            sudo -u ubuntu -H bash -lc "cd '$DEPLOY_PATH' && npm run verify:current-candle"
          fi
          echo DEPLOYMENT_COMPLETE'

          SCRIPT_B64=$(printf '%s' "$REMOTE_SCRIPT" | base64 -w0)
          COMMANDS_JSON=$(python -c 'import json,os; print(json.dumps(["printf %s | base64 -d | bash -s -- %s %s %s %s" % (os.environ["SCRIPT_B64"], os.environ["APPLICATION_PATH"], os.environ["TARGET_REF"], os.environ["RUNTIME_ACTION"], os.environ["TARGET_REPOSITORY"])]))')
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "${TARGET_REPOSITORY} EC2 deployment" \
            --parameters "commands=$COMMANDS_JSON" \
            --query 'Command.CommandId' --output text)
          echo "SSM_COMMAND_ID=$COMMAND_ID"

          set +e
          aws ssm wait command-executed --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          WAITER_STATUS=$?
          set -e

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" | tee deployment-result.json

          if [ "$WAITER_STATUS" -ne 0 ]; then
            echo "SSM waiter failed with exit code $WAITER_STATUS"
            exit "$WAITER_STATUS"
          fi

          INVOCATION_STATUS=$(python -c 'import json; print(json.load(open("deployment-result.json"))["Status"])')
          if [ "$INVOCATION_STATUS" != "Success" ]; then
            echo "SSM invocation status: $INVOCATION_STATUS"
            exit 1
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ec2-deployment-${{ inputs.target_repository }}-${{ github.run_id }}
          path: deployment-result.json
          if-no-files-found: warn
