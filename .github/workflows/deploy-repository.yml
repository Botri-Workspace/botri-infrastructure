name: EC2 Repository Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing AWS configuration
        required: true
        default: production
        type: string
      target_repository:
        description: GitHub repository directory name already checked out on EC2
        required: true
        type: string
      target_ref:
        description: Git ref to deploy
        required: true
        default: main
        type: string
      application_path:
        description: Absolute application path on EC2
        required: true
        type: string
      runtime_action:
        description: Runtime action after synchronization
        required: true
        default: none
        type: choice
        options:
          - none
          - restart
          - reload

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_REF: ${{ inputs.target_ref }}
          APPLICATION_PATH: ${{ inputs.application_path }}
          RUNTIME_ACTION: ${{ inputs.runtime_action }}
        run: |
          set -euo pipefail

          case "$APPLICATION_PATH" in
            /home/ubuntu/Botri-Workspace/*[!A-Za-z0-9._/-]*) echo 'Rejected: invalid application_path'; exit 2 ;;
            /home/ubuntu/Botri-Workspace/*) ;;
            *) echo 'Rejected: application_path must be under /home/ubuntu/Botri-Workspace'; exit 2 ;;
          esac
          case "$TARGET_REPOSITORY" in
            ''|*[!A-Za-z0-9._-]*) echo 'Rejected: invalid target_repository'; exit 2 ;;
          esac
          case "$TARGET_REF" in
            ''|*[!A-Za-z0-9._/-]*|*..*|/*) echo 'Rejected: invalid target_ref'; exit 2 ;;
          esac
          case "$RUNTIME_ACTION" in
            none|restart|reload) ;;
            *) echo 'Rejected: invalid runtime_action'; exit 2 ;;
          esac

          COMMANDS_JSON=$(jq -n \
            --arg path "$APPLICATION_PATH" \
            --arg ref "$TARGET_REF" \
            --arg action "$RUNTIME_ACTION" \
            --arg app "$TARGET_REPOSITORY" \
            '{commands: [
              "set -u",
              "echo DEPLOY_BEGIN",
              ("echo APPLICATION_PATH=" + $path),
              ("echo TARGET_REF=" + $ref),
              ("echo RUNTIME_ACTION=" + $action),
              ("test -d " + ($path|@sh) + " || { echo APPLICATION_PATH_MISSING; exit 10; }"),
              ("test -d " + (($path + "/.git")|@sh) + " || { echo GIT_DIRECTORY_MISSING; exit 11; }"),
              ("git -C " + ($path|@sh) + " rev-parse --show-toplevel"),
              ("git -C " + ($path|@sh) + " remote -v"),
              ("GIT_TERMINAL_PROMPT=0 git -C " + ($path|@sh) + " fetch --prune origin"),
              ("git -C " + ($path|@sh) + " checkout " + ($ref|@sh)),
              ("git -C " + ($path|@sh) + " reset --ff-only origin/" + ($ref|@sh)),
              ("echo DEPLOYED_COMMIT=$(git -C " + ($path|@sh) + " rev-parse HEAD)"),
              ("if [ " + ($action|@sh) + " = restart ]; then pm2 restart " + ($app|@sh) + "; elif [ " + ($action|@sh) + " = reload ]; then pm2 reload " + ($app|@sh) + "; fi"),
              "pm2 status",
              "echo DEPLOYMENT_COMPLETE"
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "botri-infrastructure deployment ${TARGET_REPOSITORY}@${TARGET_REF}" \
            --parameters "$COMMANDS_JSON" \
            --query 'Command.CommandId' --output text)

          echo "SSM_COMMAND_ID=$COMMAND_ID"

          set +e
          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" | tee deployment-result.json

          COMMAND_STATUS=$(jq -r '.Status // "Unknown"' deployment-result.json)
          COMMAND_STATUS_DETAILS=$(jq -r '.StatusDetails // "Unknown"' deployment-result.json)
          COMMAND_STDOUT=$(jq -r '.StandardOutputContent // ""' deployment-result.json)
          COMMAND_STDERR=$(jq -r '.StandardErrorContent // ""' deployment-result.json)

          printf '%s\n' "$COMMAND_STDOUT"
          printf '%s\n' "$COMMAND_STDERR" >&2
          echo "SSM_STATUS=$COMMAND_STATUS"
          echo "SSM_STATUS_DETAILS=$COMMAND_STATUS_DETAILS"

          if [ "$WAIT_EXIT" -ne 0 ] || [ "$COMMAND_STATUS" != "Success" ]; then
            echo "SSM deployment failed: status=$COMMAND_STATUS status_details=$COMMAND_STATUS_DETAILS"
            exit 1
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec2-deployment-${{ github.run_id }}
          path: deployment-result.json
          if-no-files-found: warn
